name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Format sources for bootstrap artifact
        run: bun run format

      - name: Verify
        run: bun run check

      - name: Pack
        run: bun run pack

      - name: Upload bootstrap source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dilexy-ui-bootstrap
          path: |
            .github
            .storybook
            docs
            scripts
            src
            .gitignore
            .prettierignore
            .prettierrc.json
            biome.json
            bun.lock
            CONTRIBUTING.md
            package.json
            postcss.config.mjs
            README.md
            stylelint.config.mjs
            tsconfig.app.json
            tsconfig.json
            tsconfig.node.json
            vite.config.ts
            vitest.config.ts
          if-no-files-found: error

      - name: Upload outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dilexy-ui-build
          path: |
            build/dist
            build/coverage
            build/storybook-static
            build/package
          if-no-files-found: error
