name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run check

      - name: Pack
        run: bun run pack

      - name: Verify packed package in consumer app
        run: |
          consumer_dir="$(mktemp -d)"
          mkdir -p "$consumer_dir/src"
          cd "$consumer_dir"

          cat > package.json <<JSON
          {
            "name": "dilexy-ui-consumer-smoke-test",
            "private": true,
            "type": "module",
            "scripts": {
              "build": "vite build",
              "typecheck": "vue-tsc --noEmit"
            },
            "dependencies": {
              "@dilexy/ui": "file:$GITHUB_WORKSPACE/build/package/dilexy-ui-0.1.0.tgz",
              "@nuxt/ui": "4.10.0",
              "tailwindcss": "4.3.3",
              "vue": "3.5.40"
            },
            "devDependencies": {
              "@vitejs/plugin-vue": "6.0.8",
              "typescript": "6.0.3",
              "vite": "7.3.6",
              "vue-tsc": "3.3.8"
            }
          }
          JSON

          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Dilexy UI consumer smoke test</title>
            </head>
            <body>
              <div id="app" class="isolate"></div>
              <script type="module" src="/src/main.ts"></script>
            </body>
          </html>
          HTML

          cat > vite.config.ts <<'TS'
          import ui from '@nuxt/ui/vite'
          import vue from '@vitejs/plugin-vue'
          import { defineConfig } from 'vite'

          export default defineConfig({
            plugins: [vue(), ui({ router: false })],
          })
          TS

          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "skipLibCheck": true,
              "noEmit": true,
              "types": ["vite/client"],
              "paths": {
                "#build/ui": ["./node_modules/.nuxt-ui/ui"],
                "#build/ui/*": ["./node_modules/.nuxt-ui/ui/*"]
              }
            },
            "include": ["src/**/*.ts", "src/**/*.vue", "components.d.ts", "auto-imports.d.ts"]
          }
          JSON

          cat > src/main.css <<'CSS'
          @import "tailwindcss";
          @import "@nuxt/ui";
          CSS

          cat > src/main.ts <<'TS'
          import ui from '@nuxt/ui/vue-plugin'
          import { createApp } from 'vue'
          import App from './App.vue'
          import './main.css'

          createApp(App).use(ui).mount('#app')
          TS

          cat > src/App.vue <<'VUE'
          <script setup lang="ts">
          import { Button } from '@dilexy/ui/button'
          </script>

          <template>
            <Button class="consumer_button" data-test="consumer-button" label="Consumer smoke test" />
          </template>
          VUE

          bun install
          bun run build
          bun run typecheck

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: dilexy-ui-build
          path: |
            build/dist
            build/coverage
            build/storybook-static
            build/package
          if-no-files-found: error
