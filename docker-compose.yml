services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_URL: "http://localhost:8080"
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
      CACHE_STORE: array
      LARAVEL_OCTANE: "1"
      APP_BASE_PATH: /app
      RR_RPC: "tcp://127.0.0.1:6001"
      RR_WORKERS: "${RR_WORKERS:-4}"
      RR_MAX_REQUESTS: "${RR_MAX_REQUESTS:-1000000}"
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/bench/plain"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    profiles: ["tools"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
